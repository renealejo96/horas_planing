<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#10B981">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PYGANFLOR">
    <meta name="description" content="Sistema de control de horas para finca agrícola PYGANFLOR">
    <title>PYGANFLOR - Sistema Control de Horas</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%2310B981' width='100' height='100' rx='20'/><text x='50' y='65' text-anchor='middle' font-size='50'>🌿</text></svg>">
    
    <!-- Modern Typography: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar glass-panel">
            <div class="sidebar-header">
                <i class="fa-solid fa-leaf brand-icon"></i>
                <h2>PYGANFLOR</h2>
            </div>
            
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-view="dashboard">
                    <i class="fa-solid fa-chart-line"></i> Dashboard
                </a>
                <a href="#" class="nav-item" data-view="planificacion">
                    <i class="fa-solid fa-calendar-week"></i> Plan Semanal
                </a>
                <a href="#" class="nav-item" data-view="ejecucion">
                    <i class="fa-solid fa-clipboard-check"></i> Ejecución
                </a>
                <a href="#" class="nav-item" data-view="comparativa">
                    <i class="fa-solid fa-chart-bar"></i> Comparativa
                </a>
                <a href="#" class="nav-item" data-view="personal">
                    <i class="fa-solid fa-users"></i> Personal
                </a>
                <a href="#" class="nav-item" data-view="rendimientos" id="nav-rendimientos">
                    <i class="fa-solid fa-tachometer-alt"></i> Rendimientos
                </a>
                <a href="#" class="nav-item" data-view="usuarios" id="nav-usuarios" style="display:none;">
                    <i class="fa-solid fa-user-shield"></i> Usuarios
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info" id="sidebar-user-info">
                    <div class="avatar">AD</div>
                    <div class="user-details">
                        <span class="user-name">Administrador</span>
                        <span class="user-role">Finca Principal</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar glass-panel-light">
                <h1 id="page-title">Dashboard Semanal</h1>
                <div class="top-actions">
                    <button class="btn btn-outline" id="btn-sync">
                        <i class="fa-solid fa-rotate"></i> Sincronizar
                    </button>
                    <div class="week-selector">
                        <span class="badge" id="global-semana-badge"><i class="fa-solid fa-spinner fa-spin" style="margin-right:0.3rem;"></i> Cargando...</span>
                    </div>
                    <div class="user-status-bar" id="header-user-status" style="display: none; align-items: center; gap: 0.5rem;">
                        <span class="badge" id="header-username" style="background: rgba(16, 185, 129, 0.15); color: #10B981; border: 1px solid rgba(16, 185, 129, 0.3); font-size: 0.8rem; padding: 0.35rem 0.75rem; border-radius: 6px; display: inline-flex; align-items: center; gap: 0.35rem;">
                            <i class="fa-solid fa-user"></i> <span id="header-user-text">User</span>
                        </span>
                        <button class="btn btn-outline" onclick="App.logout()" title="Cerrar Sesión" style="border-color: rgba(239, 68, 68, 0.4); color: #F87171; padding: 0.35rem 0.6rem; display: inline-flex; align-items: center; justify-content: center;">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Dynamic View Container -->
            <div id="view-container" class="content-scroll">
                <p style="padding:2rem; color:#94A3B8;">Cargando aplicación...</p>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/views/dashboard.js"></script>
    <script src="js/views/planificacion.js"></script>
    <script src="js/views/planificacion-diaria.js"></script>
    <script src="js/views/ejecucion.js"></script>
    <script src="js/views/comparativa.js"></script>
    <script src="js/views/personal.js"></script>
    <script src="js/views/rendimientos.js"></script>
    <script src="js/views/usuarios.js"></script>
    <script>
        // Iniciar la app después de que todas las vistas estén registradas
        document.addEventListener('DOMContentLoaded', () => {
            App.init();
        });
    </script>
</body>
</html>
